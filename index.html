<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoie o Candidato</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom loader for the AI processing */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center font-sans p-4">

    <!-- Main Container -->
    <div class="bg-white rounded-xl shadow-lg w-full max-w-md overflow-hidden flex flex-col">
        
        <!-- Header -->
        <div class="bg-blue-600 text-white p-6 text-center">
            <h1 class="text-2xl font-bold uppercase tracking-wide">Eu Apoio!</h1>
            <p class="text-blue-100 text-sm mt-1">Gere sua foto personalizada da campanha</p>
        </div>

        <div class="p-6 flex flex-col gap-6">
            
            <!-- Instructions & Status -->
            <div id="statusArea" class="text-center text-gray-600 text-sm h-12 flex items-center justify-center">
                Escolha uma foto sua com boa iluminação. O fundo será removido automaticamente!
            </div>

            <!-- Canvas Container (Preview) -->
            <div class="relative w-full aspect-square bg-gray-200 rounded-lg overflow-hidden border-2 border-dashed border-gray-300 flex items-center justify-center shadow-inner">
                <canvas id="campaignCanvas" class="w-full h-full object-cover hidden"></canvas>
                <div id="placeholderText" class="text-gray-400 text-center p-4">
                    <svg class="w-12 h-12 mx-auto mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    Sua foto aparecerá aqui
                </div>
            </div>

            <!-- Controls -->
            <div class="flex flex-col gap-3">
                <input type="file" id="imageInput" accept="image/*" class="hidden">
                <label for="imageInput" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-semibold py-3 px-4 rounded-lg text-center cursor-pointer transition-colors duration-200">
                    1. Escolher Foto
                </label>

                <!-- Download button -->
                <button id="downloadBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg text-center cursor-not-allowed opacity-50 transition-colors duration-200" disabled>
                    2. Baixar Imagem
                </button>
            </div>
            
            <p class="text-xs text-gray-400 text-center mt-2">
                O primeiro uso pode levar alguns segundos extras para carregar o sistema.
            </p>
        </div>
    </div>

    <!-- O script agora é do tipo módulo para carregar a IA corretamente -->
    <script type="module">
        // CORREÇÃO: Importando a função específica 'removeBackground' usando chaves
        import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";

        const imageInput = document.getElementById('imageInput');
        const canvas = document.getElementById('campaignCanvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusArea = document.getElementById('statusArea');
        const placeholderText = document.getElementById('placeholderText');

        // Resolução da imagem final
        const CANVAS_SIZE = 1080;
        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;

        // --- SEU TEMPLATE E COR DE FUNDO ---
        const TEMPLATE_URL = 'template.png'; // Substitua pelo nome da sua arte PNG
        const BACKGROUND_COLOR = '#0f48e6'; // Cor de fundo atrás da pessoa
        
        let templateImage = new Image();
        
        templateImage.onload = () => {
            console.log("Template carregado com sucesso.");
        };
        templateImage.onerror = () => {
            console.error("Aviso: template.png não encontrado. Certifique-se de que o arquivo está na mesma pasta e com este exato nome.");
        };
        templateImage.src = TEMPLATE_URL;

        function setStatus(message, isLoading = false) {
            if (isLoading) {
                statusArea.innerHTML = `<div class="flex items-center gap-2"><div class="loader"></div><span class="font-semibold text-blue-600">${message}</span></div>`;
            } else {
                statusArea.innerHTML = message;
            }
        }

        imageInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            // Reset UI
            downloadBtn.disabled = true;
            downloadBtn.classList.add('cursor-not-allowed', 'opacity-50');
            downloadBtn.classList.remove('hover:bg-blue-700');
            placeholderText.style.display = 'none';
            canvas.classList.remove('hidden');

            try {
                const userImageURL = URL.createObjectURL(file);
                
                setStatus("Baixando IA e removendo fundo (aguarde)...", true);
                
                // Configuração para puxar os modelos
                const config = {
                    publicPath: "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/dist/"
                };
                
                // CORREÇÃO: Usando a função importada corretamente
                const imageBlob = await removeBackground(userImageURL, config);
                const transparentUserImageURL = URL.createObjectURL(imageBlob);
                
                const userImage = new Image();
                userImage.src = transparentUserImageURL;
                
                userImage.onload = () => {
                    setStatus("Montando a imagem...", true);
                    
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    // Camada 1: Fundo
                    ctx.fillStyle = BACKGROUND_COLOR;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Camada 2: Pessoa Recortada
                    const scale = canvas.height / userImage.height;
                    const newWidth = userImage.width * scale;
                    const xOffset = (canvas.width - newWidth) / 2;
                    
                    ctx.drawImage(userImage, xOffset, 50, newWidth, canvas.height);

                    // Camada 3: Moldura/Template
                    if (templateImage.complete && templateImage.naturalHeight !== 0) {
                        ctx.drawImage(templateImage, 0, 0, canvas.width, canvas.height);
                    } else {
                        console.warn("Template não desenhado (não carregou).");
                    }

                    setStatus("Pronto! 🎉");
                    downloadBtn.disabled = false;
                    downloadBtn.classList.remove('cursor-not-allowed', 'opacity-50');
                    downloadBtn.classList.add('hover:bg-blue-700');
                    
                    URL.revokeObjectURL(userImageURL);
                };

            } catch (error) {
                console.error("Erro detalhado no processamento:", error);
                setStatus(`<span class="text-red-500">Erro ao processar imagem. Tente novamente.</span>`);
            }
        });

        // Download
        downloadBtn.addEventListener('click', () => {
            const dataURL = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'minha-foto-campanha.png';
            link.href = dataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

    </script>
</body>
</html>
